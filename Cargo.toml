[package]
name = "host_webhook_provider"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "host_webhook_provider"
path = "src/main.rs"

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full" ] }
regex = "1"
tracing = "0"
tracing-subscriber = "0"
futures = "0"
chrono = "0"
kube = { version = "4", features = ["runtime", "derive"] }
k8s-openapi = { version = "0", features = ["v1_35"] }
axum = { version="0", features = ["macros"] }
tower = "0"

